[project]
name = "mtg-card-recognition"
version = "0.4.0"
description = "MTG card recognition cascade library (greenfield MVP-4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "faiss-cpu>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
obb = [
    "onnxruntime>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
